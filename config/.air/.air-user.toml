root = "."
tmp_dir = "tmp/user"

[build]
cmd = "go build -o ./tmp/user/main.exe ./cmd/user/main.go"
bin = "./tmp/user/main.exe"
full_bin = "./tmp/user/main.exe"
include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml", "toml"]
exclude_dir = ["assets", "tmp", "vendor", "testdata"]
include_dir = ["cmd/user", "internal/user", "api/user", "pkg", "config"]
exclude_file = []
delay = 1000 # ms
stop_on_error = true
log = "air_errors.log"

[log]
time = true

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true
