root = "."
tmp_dir = "tmp/chatbot"

[build]
cmd = "go build -o ./tmp/chatbot/main.exe ./cmd/chatbot/main.go"
bin = "./tmp/chatbot/main.exe"
full_bin = "./tmp/chatbot/main.exe"
include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml", "toml"]
exclude_dir = ["assets", "tmp", "vendor", "testdata"]
include_dir = []
exclude_file = []
delay = 1000 # ms
stop_on_error = true
log = "air_errors.log"

[log]
time = true

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true
