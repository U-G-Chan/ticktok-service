syntax = "proto3";

package user.v1;

option go_package = "ticktok-service/api/user/v1;user";

service UserService {
    rpc Login(LoginRequest) returns (LoginResponse);
    rpc Register(RegisterRequest) returns (RegisterResponse);
    rpc GetUserInfo(GetUserInfoRequest) returns (GetUserInfoResponse);
    rpc MGetUserInfo(MGetUserInfoRequest) returns (MGetUserInfoResponse);
}

message LoginRequest {
    string username = 1;
    string password = 2;
}

message LoginResponse {
    int32 code = 1;
    string msg = 2;
    int64 user_id = 3;
    string access_token = 4;
    string refresh_token = 5;
}

message RegisterRequest {
    string username = 1;
    string password = 2;
}

message RegisterResponse {
    int32 code = 1;
    string msg = 2;
    int64 user_id = 3;
    string access_token = 4;
    string refresh_token = 5;
}

message GetUserInfoRequest {
    int64 user_id = 1;
    int64 token_user_id = 2; // User ID from token
}

message User {
    int64 id = 1;
    string name = 2;
    int64 follow_count = 3;
    int64 follower_count = 4;
    bool is_follow = 5;
    string avatar = 6;
    string background_image = 7;
    string signature = 8;
    int64 total_favorited = 9;
    int64 work_count = 10;
    int64 favorite_count = 11;
}

message GetUserInfoResponse {
    int32 code = 1;
    string msg = 2;
    User user = 3;
}

message MGetUserInfoRequest {
    repeated int64 user_ids = 1;
    int64 token_user_id = 2;
}

message MGetUserInfoResponse {
    int32 code = 1;
    string msg = 2;
    repeated User users = 3;
}
