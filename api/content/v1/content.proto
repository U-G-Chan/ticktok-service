syntax = "proto3";

package content.v1;

option go_package = "ticktok-service/api/content/v1;content";

import "user/v1/user.proto";

service ContentService {
    rpc Feed(FeedRequest) returns (FeedResponse);
    rpc PublishAction(PublishActionRequest) returns (PublishActionResponse);
    rpc GetPublishList(GetPublishListRequest) returns (GetPublishListResponse);
}

message FeedRequest {
    int64 latest_time = 1;
    string token = 2;
}

message Video {
    int64 id = 1;
    user.v1.User author = 2;
    string play_url = 3;
    string cover_url = 4;
    int64 favorite_count = 5;
    int64 comment_count = 6;
    bool is_favorite = 7;
    string title = 8;
}

message FeedResponse {
    int32 code = 1;
    string msg = 2;
    repeated Video video_list = 3;
    int64 next_time = 4;
}

message PublishActionRequest {
    string token = 1;
    bytes data = 2;
    string title = 3;
}

message PublishActionResponse {
    int32 code = 1;
    string msg = 2;
}

message GetPublishListRequest {
    int64 user_id = 1;
    string token = 2;
}

message GetPublishListResponse {
    int32 code = 1;
    string msg = 2;
    repeated Video video_list = 3;
}
