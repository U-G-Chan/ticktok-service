syntax = "proto3";

package content.v1;

option go_package = "ticktok-service/api/content/v1;content";

import "user/v1/user.proto";

service ContentService {
    // --- Feed 流 ---
    rpc GetFeed(GetFeedRequest) returns (GetFeedResponse);
    rpc GetFollowFeed(GetFollowFeedRequest) returns (GetFollowFeedResponse);

    // --- 视频发布 (两步走) ---
    // Step 1: 申请上传 URL
    rpc GetVideoUploadURL(GetVideoUploadURLRequest) returns (GetVideoUploadURLResponse);
    // Step 2: 确认发布
    rpc PublishVideo(PublishVideoRequest) returns (PublishVideoResponse);

    // --- 获取发布列表 ---
    rpc GetPublishList(GetPublishListRequest) returns (GetPublishListResponse);

    // --- 高频互动 ---
    rpc FavoriteAction(FavoriteActionRequest) returns (FavoriteActionResponse);
    rpc CommentAction(CommentActionRequest) returns (CommentActionResponse);
    rpc GetCommentList(GetCommentListRequest) returns (GetCommentListResponse);
}

// 定义核心实体 Video
message Video {
    int64 id = 1;
    user.v1.User author = 2;
    string play_url = 3;
    string cover_url = 4;
    int64 favorite_count = 5;
    int64 comment_count = 6;
    bool is_favorite = 7;
    string title = 8;
    int32 recommend_score = 9; // 新增：推荐权重
}

message Comment {
    int64 id = 1;
    user.v1.User user = 2;
    string content = 3;
    string create_date = 4;
}

// Feed 接口
message GetFeedRequest {
    int32 last_score = 1; // 上一页最后一条视频的 recommend_score，第一页传 0 
    int64 last_id = 2;    // 上一页最后一条视频的 ID，第一页传 0
    string token = 3;     // 可选，用于判断用户是否点赞
}

message GetFeedResponse {
    int32 code = 1;
    string msg = 2;
    repeated Video video_list = 3;
    int32 next_score = 4; // 返回给客户端的下一页 score 游标
    int64 next_id = 5;    // 返回给客户端的下一页 id 游标
}

message GetFollowFeedRequest {
    int64 user_id = 1;
    int64 last_time = 2; // timestamp in ms
    string token = 3;
}

message GetFollowFeedResponse {
    int32 code = 1;
    string msg = 2;
    repeated Video video_list = 3;
    int64 next_time = 4;
}

// 视频发布 Step 1
message GetVideoUploadURLRequest {
    int64 author_id = 1;
    string title = 2;
    string token = 3;
}

message GetVideoUploadURLResponse {
    int32 code = 1;
    string msg = 2;
    string upload_url = 3; // 预签名上传URL
    int64 video_id = 4;    // 返回预先生成的视频ID
}

// 视频发布 Step 2
message PublishVideoRequest {
    int64 video_id = 1;
    string play_url = 2;   // (可选)可以由服务端基于video_id拼接，或者客户端传
    string cover_url = 3;  // (可选)封面地址
    string token = 4;
}

message PublishVideoResponse {
    int32 code = 1;
    string msg = 2;
}

// 获取发布列表
message GetPublishListRequest {
    int64 user_id = 1;
    string token = 2;
}

message GetPublishListResponse {
    int32 code = 1;
    string msg = 2;
    repeated Video video_list = 3;
}

message FavoriteActionRequest {
    int64 video_id = 1;
    int32 action_type = 2; // 1-like, 2-unlike
    string token = 3;
}

message FavoriteActionResponse {
    int32 code = 1;
    string msg = 2;
}

message CommentActionRequest {
    int64 video_id = 1;
    int32 action_type = 2; // 1-create, 2-delete
    string comment_text = 3;
    int64 comment_id = 4;
    string token = 5;
}

message CommentActionResponse {
    int32 code = 1;
    string msg = 2;
    Comment comment = 3;
}

message GetCommentListRequest {
    int64 video_id = 1;
    string token = 2;
}

message GetCommentListResponse {
    int32 code = 1;
    string msg = 2;
    repeated Comment comment_list = 3;
}
