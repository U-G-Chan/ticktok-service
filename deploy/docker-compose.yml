version: "3"

services:
  mysql:
    image: docker.1ms.run/mysql:8.0
    container_name: ticktok-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ugchan123456
      MYSQL_DATABASE: ticktok
    ports:
      - "3306:3306"
    volumes:
      - ../data/mysql:/var/lib/mysql

  redis:
    image: docker.1ms.run/redis:alpine
    container_name: ticktok-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ../data/redis:/data

  minio:
    image: docker.1ms.run/minio/minio
    container_name: ticktok-minio
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: ugchan123456
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - ../data/minio:/data

  etcd:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/bitnami/etcd:latest
    container_name: ticktok-etcd
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
    ports:
      - "2379:2379"
    volumes:
      - ../data/etcd:/bitnami/etcd

  prometheus:
    image: docker.1ms.run/prom/prometheus
    container_name: ticktok-prometheus
    volumes:
      - ../config/prometheus.yml:/etc/prometheus/prometheus.yml
      - ../data/prometheus:/prometheus
    ports:
      - "19091:9090"

  grafana:
    image: docker.1ms.run/grafana/grafana
    container_name: ticktok-grafana
    volumes:
      - ../data/grafana:/var/lib/grafana
    ports:
      - "13000:3000"
    depends_on:
      - prometheus

  kafka:
    image: apache/kafka:3.7.0
    container_name: ticktok-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_METADATA_LOG_DIR: /var/lib/kafka/data
    ports:
      - "9092:9092"
    volumes:
      - ../data/kafka:/var/lib/kafka/data

  media-worker:
    build:
      context: ../
      dockerfile: deploy/Dockerfile.worker
    container_name: ticktok-media-worker
    environment:
      - TICKTOK_MYSQL_HOST=mysql
      - TICKTOK_REDIS_HOST=redis
      - TICKTOK_MINIO_ENDPOINT=minio:9000
      - TICKTOK_KAFKA_BROKERS=kafka:29092
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
      kafka:
        condition: service_started
    restart: on-failure
