apiVersion: v1
kind: Service
metadata:
  name: message
  namespace: ticktok
spec:
  ports:
    - port: 10003
      targetPort: 10003
      name: grpc
  selector:
    app: message
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: message
  namespace: ticktok
spec:
  replicas: 1
  selector:
    matchLabels:
      app: message
  template:
    metadata:
      labels:
        app: message
    spec:
      containers:
        - name: message
          image: ticktok-message:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 10003
          envFrom:
            - configMapRef:
                name: ticktok-config
            - secretRef:
                name: ticktok-secret
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          livenessProbe:
            tcpSocket:
              port: 10003
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 10003
            initialDelaySeconds: 5
            periodSeconds: 10
