apiVersion: v1
kind: Service
metadata:
  name: chatbot
  namespace: ticktok
spec:
  ports:
    - port: 10004
      targetPort: 10004
      name: grpc
  selector:
    app: chatbot
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot
  namespace: ticktok
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatbot
  template:
    metadata:
      labels:
        app: chatbot
    spec:
      containers:
        - name: chatbot
          image: ticktok-chatbot:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 10004
          envFrom:
            - configMapRef:
                name: ticktok-config
            - secretRef:
                name: ticktok-secret
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          livenessProbe:
            tcpSocket:
              port: 10004
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 10004
            initialDelaySeconds: 5
            periodSeconds: 10
