version: "3"

tasks:
  default:
    cmds:
      - task --list
    silent: true

  proto:
    desc: Generate protobuf code
    cmds:
      - protoc --proto_path=api --go_out=paths=source_relative:api --go-grpc_out=paths=source_relative:api api/user/v1/user.proto api/content/v1/content.proto api/message/v1/message.proto api/chatbot/v1/chatbot.proto

  tidy:
    desc: Run go mod tidy
    cmds:
      - go mod tidy

  docker-up:
    desc: Start Docker environment
    cmds:
      - docker-compose --env-file .env -f deploy/docker-compose.yml up -d

  docker-down:
    desc: Stop Docker environment
    cmds:
      - docker-compose --env-file .env -f deploy/docker-compose.yml down

  run-gateway:
    desc: Run gateway service
    cmds:
      - go run cmd/gateway/main.go

  run-user:
    desc: Run user service
    cmds:
      - go run cmd/user/main.go

  run-content:
    desc: Run content service
    cmds:
      - go run cmd/content/main.go

  run-worker:
    desc: Run media worker service (FFmpeg required locally if not using Docker)
    cmds:
      - go run cmd/worker/main.go

  run-message:
    desc: Run message service
    cmds:
      - go run cmd/message/main.go

  run-chatbot:
    desc: Run chatbot service
    cmds:
      - go run cmd/chatbot/main.go

  build-images:
    desc: Build all microservice Docker images
    cmds:
      - docker build --build-arg SERVICE_NAME=gateway -t ticktok-gateway:latest .
      - docker build --build-arg SERVICE_NAME=user -t ticktok-user:latest .
      - docker build --build-arg SERVICE_NAME=content -t ticktok-content:latest .
      - docker build --build-arg SERVICE_NAME=message -t ticktok-message:latest .
      - docker build --build-arg SERVICE_NAME=chatbot -t ticktok-chatbot:latest .
      - docker build --build-arg SERVICE_NAME=worker -t ticktok-worker:latest .

  import-images:
    desc: Import Docker images into k3d cluster
    cmds:
      - k3d image import ticktok-gateway:latest -c ticktok-cluster
      - k3d image import ticktok-user:latest -c ticktok-cluster
      - k3d image import ticktok-content:latest -c ticktok-cluster
      - k3d image import ticktok-message:latest -c ticktok-cluster
      - k3d image import ticktok-chatbot:latest -c ticktok-cluster
      - k3d image import ticktok-worker:latest -c ticktok-cluster

  k8s-deploy:
    desc: Deploy all Kubernetes manifests
    cmds:
      - kubectl apply -f deploy/k8s/namespaces.yaml
      - cmd: cp deploy/k8s/infra/secret.yaml.template deploy/k8s/infra/secret.yaml
        ignore_error: true
      - cmd: cp deploy/k8s/ticktok/config.yaml.template deploy/k8s/ticktok/config.yaml
        ignore_error: true
      - kubectl apply -f deploy/k8s/infra/
      - kubectl apply -f deploy/k8s/ticktok/

