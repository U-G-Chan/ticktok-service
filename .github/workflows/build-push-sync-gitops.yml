name: Build Push And Sync GitOps

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, user, content, message, chatbot, worker]
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/ticktok-${{ matrix.service }}:${{ env.IMAGE_TAG }}
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/ticktok-${{ matrix.service }}:latest

  sync-gitops-repo:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Check GitOps secrets
        id: check
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          GITOPS_REPO: ${{ secrets.GITOPS_REPO }}
        run: |
          if [ -z "$GITOPS_TOKEN" ] || [ -z "$GITOPS_REPO" ]; then
            echo "Missing GITOPS_TOKEN or GITOPS_REPO, skip GitOps sync."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout GitOps repository
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v5
        with:
          repository: ${{ secrets.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          ref: ${{ secrets.GITOPS_BRANCH || 'main' }}
          path: gitops

      - name: Update image tags in manifests
        if: steps.check.outputs.skip != 'true'
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
          MANIFEST_DIR: ${{ secrets.GITOPS_MANIFEST_DIR }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          set -euo pipefail
          cd gitops
          target_dir="${MANIFEST_DIR:-.}"

          for svc in gateway user content message chatbot worker; do
            image="image: ${ACR_REGISTRY}/${ACR_NAMESPACE}/ticktok-${svc}:${IMAGE_TAG}"
            while IFS= read -r -d '' file; do
              sed -E -i "s#image:[[:space:]]*.*ticktok-${svc}:.*#${image}#g" "$file"
            done < <(find "$target_dir" -type f \( -name "*.yaml" -o -name "*.yml" \) -print0)
          done

      - name: Commit and push GitOps changes
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          cd gitops
          if git diff --quiet; then
            echo "No manifest changes detected, skip commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore(gitops): bump ticktok-service images to ${IMAGE_TAG}"
          git push origin HEAD
